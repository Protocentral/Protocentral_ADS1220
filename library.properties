name=ProtoCentral ADS1220 24-bit ADC Library
version=2.0.0
author=Ashwin Whitchurch, Protocentral Electronics <support@protocentral.com>
maintainer=Ashwin Whitchurch, Protocentral Electronics <support@protocentral.com>
sentence=Arduino library for the ProtoCentral ADS1220 24-bit, 4-channel, low-noise ADC breakout board.
paragraph=Library for the Texas Instruments ADS1220 24-bit delta-sigma ADC. Features a modern enum/struct API, blocking and non-blocking (async) reads, automatic voltage conversion, per-instance SPI bus selection and ESP32 custom-pin support. Includes examples for single-ended and differential reads, continuous streaming, the internal temperature sensor, PGA high-resolution measurement, 3-wire PT100 RTD measurement with the dual IDAC current sources, ratiometric Wheatstone-bridge/load-cell sensing, and register diagnostics.
category=Sensors
url=https://github.com/Protocentral/Protocentral_ADS1220
architectures=*
depends=SPI
includes=Protocentral_ADS1220.h
